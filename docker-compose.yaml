services:
  mongodb:
    build:
      context: ./mongodb   # directory where your Dockerfile is located
      dockerfile: Dockerfile  # or mongodb.Dockerfile if that’s the name
    image: mongodb:1.0.0
    container_name: mongodb
    pull_policy: never

  mysql:
    build: 
      context: ./mysql
      dockerfile: Dockerfile
    image: mysql:1.0.0
    container_name: mysql
    pull_policy: never

  catalogue:
    build: 
      context: ./catalogue
      dockerfile: Dockerfile
    image: catalogue:1.0.0
    container_name: catalogue
    pull_policy: never
    depends_on:
    - mongodb

  shipping:
    build: 
      context: ./shipping
      dockerfile: Dockerfile
    image: shipping:1.0.0
    container_name: shipping
    pull_policy: never
    depends_on:
    - mysql
    - cart

  rabbitmq:
    image: rabbitmq:3
    environment:
      RABBITMQ_DEFAULT_USER: "roboshop"
      RABBITMQ_DEFAULT_PASS: "roboshop123"
    container_name: rabbitmq


  user:
    build:
      context: ./user
      dockerfile: Dockerfile
    image: user:1.0.0
    container_name: user
    pull_policy: never
    depends_on:
    - redis
    - mongodb

  payment:
    build:
      context: ./payment
      dockerfile: Dockerfile
    image: payment:1.0.0
    container_name: payment
    pull_policy: never
    environment:
      CART_HOST: "cart"
      CART_PORT: "8080"
      USER_HOST: "user"
      USER_PORT: "8080"
      AMQP_HOST: "rabbitmq"
      AMQP_USER: "roboshop"
      AMQP_PASS: "roboshop123"
    depends_on:
    - rabbitmq
    - user
    - cart

  cart:
    build:
      context: ./cart
      dockerfile: Dockerfile
    image: cart:1.0.0
    container_name: cart
    pull_policy: never
    depends_on:
    - redis
    - catalogue

  redis:
    image: redis:7.0
    container_name: redis

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    image: frontend:1.0.0
    pull_policy: never
    container_name: frontend
    ports:
    - "80:80"
    depends_on:
    - catalogue
    - user
    - cart
    - payment
    - shipping


networks:
  default:
    driver: bridge
    name: roboshop
    external: false