services:
  mongodb:
    build:
      context: ./mongodb   # directory where your Dockerfile is located
      dockerfile: Dockerfile  # or mongodb.Dockerfile if that’s the name
    image: vinod1618/mongodb:1.0.0
    container_name: mongodb
    volumes:
      - mongodb:/app/db

  mysql:
    build: 
      context: ./mysql
      dockerfile: Dockerfile
    image: vinod1618/mysql:1.0.0
    container_name: mysql
    volumes:
      - mysql:/var/lib/mysql
    

  catalogue:
    build: 
      context: ./catalogue
      dockerfile: Dockerfile
    image: vinod1618/catalogue:1.0.0
    container_name: catalogue
    
    depends_on:
    - mongodb

  shipping:
    build: 
      context: ./shipping
      dockerfile: Dockerfile
    image: vinod1618/shipping:1.0.0
    container_name: shipping
    
    depends_on:
    - mysql
    - cart

  rabbitmq:
    image: rabbitmq:3
    environment:
      RABBITMQ_DEFAULT_USER: "roboshop"
      RABBITMQ_DEFAULT_PASS: "roboshop123"
    container_name: rabbitmq
    volumes:
      - rabbitmq:/var/lib/rabbitmq


  user:
    build:
      context: ./user
      dockerfile: Dockerfile
    image: vinod1618/user:1.0.0
    container_name: user
    
    depends_on:
    - redis
    - mongodb

  payment:
    build:
      context: ./payment
      dockerfile: Dockerfile
    image: vinod1618/payment:1.0.0
    container_name: payment
    
    environment:
      CART_HOST: "cart"
      CART_PORT: "8080"
      USER_HOST: "user"
      USER_PORT: "8080"
      AMQP_HOST: "rabbitmq"
      AMQP_USER: "roboshop"
      AMQP_PASS: "roboshop123"
    depends_on:
    - rabbitmq
    - user
    - cart

  cart:
    build:
      context: ./cart
      dockerfile: Dockerfile
    image: vinod1618/cart:1.0.0
    container_name: cart
    
    depends_on:
    - redis
    - catalogue

  redis:
    image: redis:7.0
    container_name: redis
    volumes:
      - redis:/data

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    image: vinod1618/frontend:1.0.0
    
    container_name: frontend
    ports:
    - "80:80"
    depends_on:
    - catalogue
    - user
    - cart
    - payment
    - shipping


networks:
  default:
    driver: bridge
    name: roboshop
    external: false

volumes:
  mongodb:
  redis:
  mysql:
  rabbitmq: